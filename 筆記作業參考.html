<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 課堂筆記與作業參考專區</title>
</head>
<body bgcolor="#1E1E2E" style="color: #CDD6F4; font-family: sans-serif; margin: 20px;"> 

    <div style="margin-bottom: 15px;">
        <button onclick="location.href='index.html'" style="padding: 8px 15px; border-radius: 5px; border: none; background-color: #45475A; color: white; cursor: pointer;">🏠 返回首頁</button>
    </div>
    
    <hr style="border-color: #313244;">

    <h1 style="color: #89B4FA; font-family: sans-serif;">📚 課堂筆記與作業參考</h1>
    <p style="color: #A6ADC8;">導師專屬發布頻道 | 隨時參考課堂重點與解答範例</p>

    <!-- 訊息顯示區 -->
    <div id="dc-chat-area" onscroll="saveScrollPosition()" style="width: 100%; max-width: 800px; height: 420px; background-color: #181825; border: 1px solid #313244; border-radius: 8px; padding: 15px; overflow-y: scroll; box-sizing: border-box; margin-bottom: 20px;">
        <div style="color: #89B4FA; text-align: center; padding-top: 150px;" id="loading-text">
            <h3>📡 正在載入筆記與作業資料...</h3>
        </div>
    </div>

    <!-- 發布區域 (管理員專屬) -->
    <div id="admin-panel" style="display: none; width: 100%; max-width: 800px; background-color: #313244; padding: 20px; border-radius: 8px; box-sizing: border-box; border: 1px solid #45475A; margin-bottom: 20px;">
        <h3 style="margin-top: 0; color: #A6E3A1;">✍️ 發布新筆記 / 作業參考</h3>

        <div style="margin-bottom: 12px;">
            <label><b>📌 主題標題：</b></label>
            <input type="text" id="msg-title" style="width: 100%; background-color: #181825; color: white; border: 1px solid #45475A; padding: 10px; border-radius: 5px; box-sizing: border-box;" placeholder="例：[作業參考] C語言陣列與迴圈基礎">
        </div>

        <div style="margin-bottom: 12px;">
            <label><b>✍️ 筆記 / 說明內文：</b></label><br>
            <textarea id="msg-content" rows="5" style="width: 100%; background-color: #181825; color: white; border: 1px solid #45475A; padding: 10px; border-radius: 5px; box-sizing: border-box;" placeholder="請輸入說明或解題思路..."></textarea>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px;">
            <div>
                <label><b>📄 夾帶 TXT 檔：</b></label><br>
                <input type="file" id="file-txt" accept=".txt" style="font-size: 13px; margin-top: 5px;">
            </div>
            <div>
                <label><b>🖼️ 夾帶圖片：</b></label><br>
                <input type="file" id="file-img" accept="image/*" style="font-size: 13px; margin-top: 5px;">
            </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: flex-end;">
            <button onclick="handleAdminSend()" id="send-btn" style="padding: 10px 25px; background-color: #A6E3A1; color: #11111B; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px;">✈️ 發送筆記</button>
        </div>
    </div>

    <!-- 🛠️ 診斷控制台 -->
    <div style="width: 100%; max-width: 800px; background-color: #11111B; border: 1px solid #F38BA8; border-radius: 8px; padding: 15px; box-sizing: border-box;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h4 style="margin: 0; color: #F38BA8;">🔍 系統即時診斷偵測器 (Debug Console)</h4>
            <button onclick="document.getElementById('debug-log').value=''" style="background:#45475A; color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; font-size:12px;">清空日誌</button>
        </div>
        <textarea id="debug-log" style="width: 100%; height: 120px; background-color: #181825; color: #A6E3A1; font-family: monospace; font-size: 12px; border: 1px solid #313244; margin-top: 10px; padding: 8px; box-sizing: border-box;" readonly placeholder="診斷日誌將會顯示於此..."></textarea>
    </div>

    <script>
        const API_BASE_URL = "https://basic-electricityggggg.vercel.app/api/chat";
        const ADMIN_TOKEN = "ADMIN_TEACHER_SECRET_1163"; 

        let globalMessagesCache = [];
        let pollingTimer = null;
        let isOperating = false;

        function logDebug(msg) {
            const logBox = document.getElementById("debug-log");
            if (logBox) {
                const time = new Date().toLocaleTimeString();
                logBox.value = `[${time}] ${msg}\n` + logBox.value;
            }
        }

        if (!localStorage.getItem("thu_user_token")) {
            localStorage.setItem("thu_user_token", "user_" + Date.now());
        }
        const MY_USER_TOKEN = localStorage.getItem("thu_user_token");

        window.onload = function() {
            logDebug("系統初始化完成");
            const adminPanel = document.getElementById("admin-panel");
            if (adminPanel) {
                if (MY_USER_TOKEN === ADMIN_TOKEN || localStorage.getItem("is_admin") === "true") {
                    adminPanel.style.display = "block";
                    logDebug("權限確認：管理員身份");
                }
            }

            fetchChatHistory();
            startPolling();
        };

        function startPolling() {
            if (pollingTimer) clearInterval(pollingTimer);
            pollingTimer = setInterval(() => {
                if (!isOperating) fetchChatHistory();
            }, 5000);
        }

        function stopPolling() {
            if (pollingTimer) clearInterval(pollingTimer);
        }

        // 核心修改：使用 雙重動態防快取網址（時間戳記 + 隨機數），強制擊穿 Vercel CDN 暫存
        async function fetchChatHistory() {
            if (isOperating) return; 

            try {
                const cacheBuster = `t=${Date.now()}&r=${Math.floor(Math.random() * 100000)}`;
                const targetUrl = `${API_BASE_URL}?${cacheBuster}`;

                const response = await fetch(targetUrl, { 
                    method: 'GET',
                    cache: 'no-store'
                });

                if (!response.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);
                
                const result = await response.json();
                const history = (result.data && Array.isArray(result.data.messages)) ? result.data.messages : [];

                if (history.length !== globalMessagesCache.length) {
                    logDebug(`📡 收到同步更新，最新筆記筆數：${history.length} 筆 (原 ${globalMessagesCache.length} 筆)`);
                }

                globalMessagesCache = history;
                renderMessages(history);

            } catch (error) {
                logDebug(`❌ 讀取資料失敗: ${error.message}`);
            }
        }

        function renderMessages(history) {
            const chatArea = document.getElementById("dc-chat-area");
            if (!chatArea) return;

            chatArea.innerHTML = "";
            
            if (history.length > 0) {
                history.forEach((msg, index) => {
                    appendMessageToHTML(msg, index);
                });

                const savedScrollTop = localStorage.getItem("note_scroll_top");
                if (savedScrollTop) chatArea.scrollTop = parseInt(savedScrollTop);
            } else {
                chatArea.innerHTML = `<div style="color:#89B4FA;text-align:center;padding-top:150px;">📚 目前尚無發布的課堂筆記或作業參考。</div>`;
            }
        }

        function saveScrollPosition() {
            const chatArea = document.getElementById("dc-chat-area");
            if (chatArea) {
                localStorage.setItem("note_scroll_top", chatArea.scrollTop);
            }
        }

        async function deleteTopic(index) {
            if (!confirm(`⚠️ 確定要刪除第 ${index + 1} 筆主題嗎？`)) return;

            logDebug(`🚨 開始執行刪除 - 目標索引: [${index}]`);
            isOperating = true;
            stopPolling();

            const delBtn = document.getElementById(`del-btn-${index}`);
            if (delBtn) {
                delBtn.disabled = true;
                delBtn.innerText = "刪除中...";
            }

            const updatedList = globalMessagesCache.filter((_, idx) => idx !== index);

            try {
                const cacheBuster = `t=${Date.now()}&r=${Math.floor(Math.random() * 100000)}`;
                const targetUrl = `${API_BASE_URL}?${cacheBuster}`;
                logDebug(`正在發送 POST 覆寫請求至: ${targetUrl}`);

                const response = await fetch(targetUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ overrideMessages: updatedList })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || `伺服器回應失敗碼: ${response.status}`);
                }

                logDebug(`✅ GitHub 寫入成功！新 SHA: ${result.newSha ? result.newSha.substring(0,7) : '無'}, 剩餘: ${result.updatedCount} 筆`);

                globalMessagesCache = result.messages || updatedList;
                renderMessages(globalMessagesCache);
                alert("🗑️ 主題已成功刪除！");

            } catch (err) {
                logDebug(`❌ 刪除失敗! 錯誤訊息: ${err.message}`);
                alert(`刪除失敗：${err.message}`);
                if (delBtn) {
                    delBtn.disabled = false;
                    delBtn.innerText = "❌ 刪除主題";
                }
            } finally {
                setTimeout(() => {
                    logDebug("恢復背景自動輪詢 (Polling)...");
                    isOperating = false;
                    startPolling();
                }, 4000);
            }
        }

        async function handleAdminSend() {
            const titleInput = document.getElementById("msg-title");
            const contentInput = document.getElementById("msg-content");
            const title = titleInput ? titleInput.value.trim() : "";
            const content = contentInput ? contentInput.value.trim() : "";
            
            const txtFiles = document.getElementById("file-txt") ? document.getElementById("file-txt").files : [];
            const imgFiles = document.getElementById("file-img") ? document.getElementById("file-img").files : [];

            if (title === "" && content === "" && txtFiles.length === 0 && imgFiles.length === 0) {
                alert("請填寫內容！");
                return;
            }

            logDebug("開始發送新筆記...");
            isOperating = true;
            stopPolling();

            let msgObj = {
                id: "msg_" + Date.now(),
                token: MY_USER_TOKEN, 
                time: new Date().toLocaleString(),
                title: title,
                content: content,
                txtFileName: txtFiles.length > 0 ? txtFiles.item(0).name : null,
                txtContent: null,
                imgData: null
            };

            try {
                if (txtFiles.length > 0) {
                    msgObj.txtContent = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = e => resolve(e.target.result);
                        reader.onerror = err => reject(err);
                        reader.readAsText(txtFiles.item(0));
                    });
                }

                if (imgFiles.length > 0) {
                    msgObj.imgData = await compressImage(imgFiles.item(0), 800, 800, 0.55);
                }

                const cacheBuster = `t=${Date.now()}&r=${Math.floor(Math.random() * 100000)}`;
                const targetUrl = `${API_BASE_URL}?${cacheBuster}`;
                const response = await fetch(targetUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ newMsg: msgObj })
                });

                const resData = await response.json();
                if (!response.ok || !resData.success) throw new Error(resData.error || "寫入失敗");

                logDebug(`✅ 發布成功！新 SHA: ${resData.newSha ? resData.newSha.substring(0,7) : '未知'}`);

                if (document.getElementById("msg-title")) document.getElementById("msg-title").value = "";
                if (document.getElementById("msg-content")) document.getElementById("msg-content").value = "";
                if (document.getElementById("file-txt")) document.getElementById("file-txt").value = "";
                if (document.getElementById("file-img")) document.getElementById("file-img").value = "";

                fetchChatHistory();

            } catch (err) {
                logDebug(`❌ 發布失敗: ${err.message}`);
                alert(`發布失敗：${err.message}`);
            } finally {
                isOperating = false;
                startPolling();
            }
        }

        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                        const canvas = document.createElement("canvas");
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        function appendMessageToHTML(msg, index) {
            if (!msg || typeof msg !== 'object') return;

            const chatArea = document.getElementById("dc-chat-area");
            if (!chatArea) return;

            let mediaHtml = "";

            if (msg.txtContent) {
                const lineCount = msg.txtContent.split('\n').length;
                let displayTxt = msg.txtContent.length > 4000 ? msg.txtContent.substring(0, 4000) + "\n\n...[預覽截斷]" : msg.txtContent;

                mediaHtml += `
                    <div style="background-color: #181825; padding: 10px; border-radius: 5px; margin-top: 10px; border: 1px solid #313244;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                            <span style="color: #A6E3A1; font-size: 13px;">📄 檔案：<b>${msg.txtFileName || 'note.txt'}</b> (${lineCount} 行)</span>
                        </div>
                        <textarea style="width: 100%; height: 140px; background-color: #11111B; color: #CDD6F4; font-size: 12px; border: none; padding: 8px; box-sizing: border-box; resize: vertical;" readonly>${displayTxt}</textarea>
                    </div>
                `;
            }

            if (msg.imgData) {
                mediaHtml += `<img src="${msg.imgData}" style="max-width: 100%; max-height: 300px; border-radius: 5px; margin-top: 10px; border: 1px solid #45475A;"><br>`;
            }

            const isAdmin = (MY_USER_TOKEN === ADMIN_TOKEN || localStorage.getItem("is_admin") === "true");
            const deleteBtnHtml = isAdmin ? `<button id="del-btn-${index}" onclick="deleteTopic(${index})" style="background-color: #F38BA8; color: #11111B; border: none; padding: 3px 8px; border-radius: 3px; font-size: 12px; cursor: pointer; font-weight: bold; float: right;">❌ 刪除主題</button>` : '';

            let msgHtml = `
                <div style="margin-bottom: 20px; border-bottom: 1px solid #313244; padding-bottom: 15px;">
                    ${deleteBtnHtml}
                    <span style="color: #89B4FA; font-weight: bold; font-size: 14px;">👤 授課導師/發布者</span>
                    <span style="color: #6C7086; font-size: 11px; margin-left: 8px;">${msg.time || ''}</span>
                    
                    <div style="color: #CDD6F4; margin-top: 8px; background-color: #1E1E2E; padding: 15px; border-radius: 6px; border: 1px solid #313244;">
                        ${msg.title ? `<h3 style="color: #89B4FA; margin: 0 0 8px 0;">📌 ${msg.title}</h3>` : ''}
                        <p style="margin: 0; white-space: pre-wrap; font-size: 14px; line-height: 1.6;">${msg.content || ''}</p>
                        ${mediaHtml}
                    </div>
                </div>
            `;
            chatArea.innerHTML += msgHtml;
        }
    </script>
</body>
</html>
